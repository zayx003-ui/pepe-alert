name: Vérifications

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Typage
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test

      - name: Tests SQL (migrations, RLS, récompenses)
        run: npm run test:sql

      - name: Build de production
        run: npm run build

      - name: Navigateur de test
        run: npx playwright install --with-deps chromium

      - name: Tests navigateur (build de production, plusieurs clients)
        run: npm run test:e2e

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: test-results/
          retention-days: 7
